<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم الإدارة 💈</title>
  <style>
    :root { --bg-color: #0f172a; --card-bg: #1e293b; --accent-color: #22c55e; --text-color: #f8fafc; --border-color: #334155; }
    * { box-sizing: border-box; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; padding: 20px 15px; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; }
    h1 { text-align: center; font-size: 24px; margin-bottom: 20px; }
    .card { background-color: var(--card-bg); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); }
    .card h2 { font-size: 18px; text-align: center; margin-bottom: 15px; color: #cbd5e1; }
    .form-group { margin-bottom: 12px; }
    input { width: 100%; padding: 12px 15px; border-radius: 10px; border: 1px solid var(--border-color); font-size: 16px; background: #fff; color: #0f172a; outline: none; }
    .btn { width: 100%; background-color: var(--accent-color); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .salon-item { background: #0f172a; padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--border-color); }
    .salon-title { font-size: 18px; font-weight: bold; color: var(--accent-color); margin-bottom: 6px; }
    .code-box { background: #334155; padding: 8px 12px; border-radius: 8px; font-family: monospace; font-size: 18px; text-align: center; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; }
    .copy-btn { background: #0284c7; color: white; border: none; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .empty-msg { text-align: center; color: #64748b; font-size: 15px; padding: 10px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>لوحة تحكم الإدارة 💈</h1>
    
    <div class="card">
      <h2>إضافة صالون جديد</h2>
      <div class="form-group"><input type="text" id="salonName" placeholder="اسم الصالون (مثال: صالون يسر)"></div>
      <div class="form-group"><input type="tel" id="salonPhone" placeholder="رقم الهاتف (مثال: 0788457518)"></div>
      <button class="btn" onclick="generateSalonCode()">توليد الكود والحفظ أونلاين</button>
    </div>

    <div class="card">
      <h2>الصالونات المسجلة</h2>
      <div id="salonsList"><div class="empty-msg">جاري تحميل البيانات...</div></div>
    </div>
  </div>

  <script>
    // تم تصحيح اسم المستودع هنا ليطابق حسابك
    const REPO_OWNER = 'hamzeanees17-debug';
    const REPO_NAME = 'Adman-app';
    
    const EncryptedToken = "Z2hwX1BxNGJRcUpaZmFiNWJpYnozUmVFSk9Vb3A2M0VYUTRMaEJKSQ=="; 
    
    function getToken() {
      try { return atob(EncryptedToken); } catch(e) { return ""; }
    }

    async function getDB() {
      const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/data.json?cacheBust=${Date.now()}`, {
        headers: { Authorization: `token ${getToken()}` }
      });
      if(!res.ok) throw new Error('تأكد من وجود ملف data.json في المستودع');
      const data = await res.json();
      
      const binaryStr = atob(data.content.replace(/\s/g, ''));
      const bytes = Uint8Array.from(binaryStr, c => c.charCodeAt(0));
      const contentStr = new TextDecoder().decode(bytes);
      
      return { content: JSON.parse(contentStr), sha: data.sha };
    }

    async function saveDB(content, sha) {
      const jsonString = JSON.stringify(content, null, 2);
      
      const bytes = new TextEncoder().encode(jsonString);
      const binaryStr = Array.from(bytes, b => String.fromCharCode(b)).join('');
      const encodedContent = btoa(binaryStr);

      const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/data.json`, {
        method: 'PUT',
        headers: { Authorization: `token ${getToken()}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: "Update salons from Admin", content: encodedContent, sha: sha })
      });
      if(!res.ok) alert('فشل الحفظ أونلاين، تحقق من صلاحيات المفتاح');
    }

    async function generateSalonCode() {
      const name = document.getElementById('salonName').value.trim();
      const phone = document.getElementById('salonPhone').value.trim();
      if (!name || !phone) return alert('أدخل الاسم ورقم الهاتف');

      try {
        const db = await getDB();
        if(!db.content.salons) db.content.salons = {};
        const code = 'SALON-' + Math.floor(100000 + Math.random() * 900000);
        db.content.salons[code] = { name, phone, code, queue: [] };
        
        await saveDB(db.content, db.sha);
        document.getElementById('salonName').value = '';
        document.getElementById('salonPhone').value = '';
        alert(`تم الحفظ أونلاين بنجاح!\nالكود: ${code}`);
        loadSalons();
      } catch(e) { alert(e.message); }
    }

    async function loadSalons() {
      const salonsList = document.getElementById('salonsList');
      try {
        const db = await getDB();
        const salons = db.content.salons || {};
        const keys = Object.keys(salons);
        if (keys.length === 0) {
          salonsList.innerHTML = '<div class="empty-msg">لا يوجد صالونات بعد</div>';
          return;
        }
        salonsList.innerHTML = keys.map(k => `
          <div class="salon-item">
            <div class="salon-title">${salons[k].name}</div>
            <div style="color:#94a3b8;font-size:14px;margin-bottom:8px;">📱 الهاتف: ${salons[k].phone}</div>
            <div class="code-box">
              <span>🔑 ${salons[k].code}</span>
              <button class="copy-btn" onclick="navigator.clipboard.writeText('${salons[k].code}');alert('تم النسخ');">نسخ</button>
            </div>
          </div>
        `).join('');
      } catch(e) { salonsList.innerHTML = `<div class="empty-msg" style="color:#ef4444;">${e.message}</div>`; }
    }

    loadSalons();
  </script>
</body>
</html>
