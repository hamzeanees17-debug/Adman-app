<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم الفائقة | Hamza Qashtam</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root { --bg: #0b0f19; --card: #111827; --primary: #3b82f6; --accent: #10b981; --danger: #ef4444; --text: #f9fafb; --border: #374151; }
    * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); padding: 20px 15px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 15px; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-danger { background: var(--danger); }
    .btn-accent { background: var(--accent); color: #000; }
    input { width: 100%; padding: 10px; margin: 8px 0; background: #1f2937; border: 1px solid var(--border); color: #fff; border-radius: 8px; outline: none; }
    .salon-box { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding: 12px 0; }
    .receipt-img { max-width: 100%; border-radius: 8px; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h2>لوحة تحكم الصالونات 💈</h2>
    <span style="color: var(--primary); font-weight: bold;">Dev: Hamza Qashtam</span>
  </div>

  <div class="card">
    <h3>إضافة صالون وتوليد كود اشتراك</h3>
    <input type="text" id="salonName" placeholder="اسم الصالون">
    <input type="tel" id="salonPhone" placeholder="رقم الهاتف">
    <button class="btn" id="createSalonBtn">توليد الكود والتفعيل</button>
  </div>

  <div class="card">
    <h3>قائمة الصالونات والاشتراكات</h3>
    <div id="salonsList">جاري التحميل...</div>
  </div>

  <script>
    // تهيئة Firebase سحابي مدمج للتزامن المباشر
    const firebaseConfig = { databaseURL: "https://salon-system-hq-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const nameIn = document.getElementById('salonName');
    const phoneIn = document.getElementById('salonPhone');
    const salonsList = document.getElementById('salonsList');

    document.getElementById('createSalonBtn').addEventListener('click', () => {
      const name = nameIn.value.trim();
      const phone = phoneIn.value.trim();
      if (!name || !phone) return alert('أدخل كافة البيانات');

      const code = Math.floor(100000 + Math.random() * 900000).toString();
      const expiryDate = new Date();
      expiryDate.setDate(expiryDate.getDate() + 30); // اشتراك 30 يوم مبدئياً

      db.ref('salons/' + code).set({
        info: { name, phone, code, active: true, expiry: expiryDate.toISOString(), used: false },
        settings: { themeColor: '#3b82f6', bgUrl: '', headerUrl: '', chairs: 1 }
      }).then(() => {
        alert('تم توليد كود التفعيل: ' + code);
        nameIn.value = ''; phoneIn.value = '';
      });
    });

    db.ref('salons').on('value', snapshot => {
      const data = snapshot.val();
      if (!data) return salonsList.innerHTML = 'لا يوجد صالونات بعد';

      salonsList.innerHTML = '';
      Object.keys(data).forEach(code => {
        const item = data[code].info;
        const daysLeft = Math.ceil((new Date(item.expiry) - new Date()) / (1000 * 60 * 60 * 24));
        
        const div = document.createElement('div');
        div.className = 'salon-box';
        div.innerHTML = `
          <div>
            <strong>${item.name} (${item.phone})</strong><br>
            <small style="color: #9ca3af">كود: ${code} | الأيام المتبقية: ${daysLeft > 0 ? daysLeft : 0}</small>
            ${item.receipt ? `<br><a href="${item.receipt}" target="_blank" style="color:#60a5fa">عرض وصل التحويل</a>` : ''}
          </div>
          <div>
            <button class="btn ${item.active ? 'btn-danger' : 'btn-accent'}" onclick="toggleStatus('${code}', ${item.active})">
              ${item.active ? 'تعطيل' : 'تفعيل'}
            </button>
            <button class="btn" onclick="renewSubscription('${code}')">تجديد +30 يوم</button>
          </div>
        `;
        salonsList.appendChild(div);
      });
    });

    window.toggleStatus = (code, current) => db.ref(`salons/${code}/info/active`).set(!current);
    window.renewSubscription = (code) => {
      const newExp = new Date();
      newExp.setDate(newExp.getDate() + 30);
      db.ref(`salons/${code}/info`).update({ expiry: newExp.toISOString(), active: true, receipt: null });
    };
  </script>
</body>
</html>
