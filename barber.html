<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الحلاق | Hamza Qashtam</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0f19;
      --panel-bg: #111827;
      --card-bg: #1f2937;
      --primary: #3b82f6;
      --accent: #10b981;
      --danger: #ef4444;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --border: #374151;
    }
    * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 20px 16px; }
    .container { max-width: 500px; margin: 0 auto; }
    .card { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; text-align: center; }
    .form-control { width: 100%; background: var(--bg-main); border: 1px solid var(--border); border-radius: 10px; padding: 12px; color: #fff; font-size: 16px; margin: 10px 0; text-align: center; outline: none; }
    .btn { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 16px; cursor: pointer; }
    .queue-item { background: var(--card-bg); border-radius: 12px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
    .btn-done { background: var(--accent); color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <!-- تسجيل الدخول بالحساب -->
    <div id="loginSection" class="card">
      <h2>تسجيل دخول الحلاق 💈</h2>
      <p style="color: var(--text-muted); font-size: 14px; margin-top: 5px;">أدخل كود التفعيل الخاص بالصالون</p>
      <input type="text" id="salonCodeInput" class="form-control" placeholder="أدخل الكود (مثال: 123456)">
      <button class="btn" id="loginBtn">دخول لوحة التحكّم</button>
    </div>

    <!-- لوحة إدارة الأدوار -->
    <div id="dashboardSection" class="hidden">
      <div class="card">
        <h2 id="salonTitle">صالون الحلاقة</h2>
        <p style="color: var(--accent); font-weight: bold; margin-top: 5px;" id="queueCount">عدد المنتظرين: 0</p>
      </div>

      <div class="card">
        <h3 style="margin-bottom: 15px; font-size: 18px;">قائمة الدور الحالية</h3>
        <div id="customerQueue">
          <p style="color: var(--text-muted);">لا يوجد زبائن في الانتظار حالياً</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const loginBtn = document.getElementById('loginBtn');
      const codeInput = document.getElementById('salonCodeInput');
      const loginSection = document.getElementById('loginSection');
      const dashboardSection = document.getElementById('dashboardSection');
      const salonTitle = document.getElementById('salonTitle');
      const customerQueue = document.getElementById('customerQueue');
      const queueCount = document.getElementById('queueCount');

      let currentSalon = null;

      function getSalons() {
        return JSON.parse(localStorage.getItem('salon_app_db')) || [];
      }

      function getQueue(code) {
        return JSON.parse(localStorage.getItem('queue_' + code)) || [];
      }

      function saveQueue(code, queue) {
        localStorage.setItem('queue_' + code, JSON.stringify(queue));
      }

      function renderQueue() {
        if (!currentSalon) return;
        const queue = getQueue(currentSalon.code);
        queueCount.innerText = `عدد المنتظرين: ${queue.length}`;

        if (queue.length === 0) {
          customerQueue.innerHTML = '<p style="color: var(--text-muted);">لا يوجد زبائن في الانتظار حالياً</p>';
          return;
        }

        customerQueue.innerHTML = queue.map((c, index) => `
          <div class="queue-item">
            <div>
              <strong>#${index + 1} - ${c.name}</strong>
              <div style="font-size: 12px; color: var(--text-muted);">📞 ${c.phone}</div>
            </div>
            <button class="btn-done" onclick="finishCustomer(${index})">إنهاء الدور ✅</button>
          </div>
        `).join('');
      }

      loginBtn.addEventListener('click', function() {
        const code = codeInput.value.trim();
        const salons = getSalons();
        const found = salons.find(s => s.code === code);

        if (!found) {
          alert('كود التفعيل غير صحيح! تأكد من الكود المولد في صفحة الأدمن.');
          return;
        }

        currentSalon = found;
        salonTitle.innerText = found.name;
        loginSection.classList.add('hidden');
        dashboardSection.classList.remove('hidden');
        renderQueue();

        // تحديث تلقائي كل 3 ثوانٍ
        setInterval(renderQueue, 3000);
      });

      window.finishCustomer = function(index) {
        let queue = getQueue(currentSalon.code);
        queue.splice(index, 1);
        saveQueue(currentSalon.code, queue);
        renderQueue();
      };
    });
  </script>
</body>
</html>
