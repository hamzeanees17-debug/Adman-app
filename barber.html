<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الحلاق الاحترافية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0f172a; --accent: #2563eb; --bg: #f1f5f9; --surface: #ffffff; --text-dark: #0f172a; --text-muted: #64748b; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); margin: 0; padding: 20px 12px; color: var(--text-dark); display: flex; justify-content: center; align-items: center; min-height: 90vh; }
        .app-container { width: 100%; max-width: 440px; }
        .card { background: var(--surface); padding: 30px 24px; border-radius: 20px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); border: 1px solid #e2e8f0; text-align: center; }
        .logo-icon { width: 64px; height: 64px; background: #eff6ff; color: var(--accent); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 15px auto; }
        h2 { margin: 0 0 8px 0; font-size: 22px; font-weight: 800; color: var(--primary); }
        p.subtitle { margin: 0 0 24px 0; font-size: 14px; color: var(--text-muted); }
        .form-group { text-align: right; margin-bottom: 16px; }
        label { font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px; display: block; }
        input, select { width: 100%; padding: 14px 16px; border: 1.5px solid #cbd5e1; border-radius: 12px; font-size: 15px; font-family: inherit; box-sizing: border-box; background: #f8fafc; transition: 0.2s; }
        input:focus, select:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
        .btn-primary { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); transition: 0.2s; }
        .btn-primary:active { transform: scale(0.98); }
        .customer-item { background: #f8fafc; border: 1px solid #e2e8f0; padding: 14px; border-radius: 12px; margin-bottom: 10px; text-align: right; display: flex; justify-content: space-between; align-items: center; }
        .step { display: none; }
        .step.active { display: block; }
    </style>
</head>
<body>
<div class="app-container">
    <div id="step1" class="card step active">
        <div class="logo-icon">💈</div>
        <h2>أهلاً بك في نظام الصالون</h2>
        <p class="subtitle">يرجى إدخال كود الصالون والـ Token لمتابعة العمل</p>
        <div class="form-group">
            <label>GitHub Personal Token</label>
            <input type="password" id="ghToken" placeholder="أدخل المفتاح الخاص بك">
        </div>
        <div class="form-group">
            <label>كود الصالون</label>
            <input type="text" id="verifyCode" placeholder="مثال: SALON-123456">
        </div>
        <button class="btn-primary" onclick="verifyAndNext()">تحقق ومتابعة ←</button>
    </div>

    <div id="step2" class="card step">
        <div class="logo-icon">✂️</div>
        <h2>بيانات الحلاق والورديّة</h2>
        <p class="subtitle">أدخل بياناتك الفردية لفتح لوحة العمل اليومية</p>
        <div class="form-group">
            <label>اسم الحلاق</label>
            <input type="text" id="barberName" placeholder="مثال: أحمد">
        </div>
        <div class="form-group">
            <label>رقم الهاتف للتواصل</label>
            <input type="tel" id="barberPhone" placeholder="07XXXXXXXX">
        </div>
        <div class="form-group">
            <label>رقم الكرسي / القسم</label>
            <select id="chairNo">
                <option value="1">كرسي رقم 1</option>
                <option value="2">كرسي رقم 2</option>
                <option value="3">كرسي رقم 3</option>
            </select>
        </div>
        <button class="btn-primary" onclick="startShift()">دخول لوحة التحكم والانتظار 🚀</button>
    </div>

    <div id="step3" class="card step">
        <h2 id="displaySalonName" style="color:var(--accent);">--</h2>
        <p class="subtitle" id="displayBarberInfo">--</p>
        <hr style="border:0; border-top:1px solid #e2e8f0; margin:15px 0;">
        <h3 style="text-align:right; font-size:16px; margin-bottom:12px;">📋 طابور الانتظار الحالي:</h3>
        <div id="queueContainer"></div>
        <button class="btn-primary" onclick="nextCustomer()" style="background:#16a34a; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);">
            ✅ إنهاء الزبون الحالي والتالي
        </button>
    </div>
</div>

<script>
    const REPO_OWNER = 'hamzeanees17-debug';
    const REPO_NAME = 'Hamza-appp';
    let currentCode = '';
    let token = '';

    async function getDB() {
        const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/data.json`, {
            headers: { Authorization: `token ${token}` }
        });
        const data = await res.json();
        const contentStr = decodeURIComponent(escape(atob(data.content)));
        return { content: JSON.parse(contentStr), sha: data.sha };
    }

    async function saveDB(content, sha) {
        const jsonString = JSON.stringify(content, null, 2);
        const encodedContent = btoa(unescape(encodeURIComponent(jsonString)));
        await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/data.json`, {
            method: 'PUT',
            headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                message: "Update queue from Barber",
                content: encodedContent,
                sha: sha
            })
        });
    }

    async function verifyAndNext() {
        token = document.getElementById('ghToken').value.trim();
        const code = document.getElementById('verifyCode').value.trim();
        if(!token || !code) return alert('يرجى إدخال المفتاح وكود الصالون');

        try {
            const db = await getDB();
            if(db.content.salons && db.content.salons[code]) {
                currentCode = code;
                document.getElementById('step1').classList.remove('active');
                document.getElementById('step2').classList.add('active');
            } else {
                alert('كود الصالون غير موجود');
            }
        } catch(e) {
            alert('حدث خطأ أثناء الاتصال بقاعدة البيانات');
        }
    }

    async function startShift() {
        const name = document.getElementById('barberName').value.trim();
        const phone = document.getElementById('barberPhone').value.trim();
        const chair = document.getElementById('chairNo').value;
        if(!name || !phone) return alert('يرجى تعبئة كامل البيانات');

        const db = await getDB();
        const salon = db.content.salons[currentCode];
        document.getElementById('displaySalonName').innerText = salon.name;
        document.getElementById('displayBarberInfo').innerText = `الحلاق: ${name} | هاتف: ${phone} | كرسي (${chair})`;
        document.getElementById('step2').classList.remove('active');
        document.getElementById('step3').classList.add('active');
        renderQueue(salon.queue || []);
    }

    function renderQueue(queue) {
        const container = document.getElementById('queueContainer');
        if(queue.length === 0) {
            container.innerHTML = '<p style="color:#94a3b8; padding:15px 0;">لا يوجد زبائن حالياً في الانتظار</p>';
            return;
        }
        container.innerHTML = queue.map((c, i) => `
            <div class="customer-item">
                <div>
                    <strong style="color:var(--primary);">#${i+1} ${c.name}</strong><br>
                    <span style="font-size:12px; color:#64748b;">📱 ${c.phone || '-'} | ✂️ ${c.service}</span>
                </div>
            </div>
        `).join('');
    }

    async function nextCustomer() {
        const db = await getDB();
        if(db.content.salons[currentCode].queue && db.content.salons[currentCode].queue.length > 0) {
            db.content.salons[currentCode].queue.shift();
            await saveDB(db.content, db.sha);
            renderQueue(db.content.salons[currentCode].queue);
        }
    }
</script>
</body>
</html>
