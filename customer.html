<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حجز دور | Hamza Qashtam</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0f19;
      --panel-bg: #111827;
      --card-bg: #1f2937;
      --primary: #3b82f6;
      --accent: #10b981;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --border: #374151;
    }
    * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 20px 16px; }
    .container { max-width: 480px; margin: 0 auto; }
    .card { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .form-control { width: 100%; background: var(--bg-main); border: 1px solid var(--border); border-radius: 10px; padding: 12px; color: #fff; font-size: 15px; margin-bottom: 12px; outline: none; }
    .btn { width: 100%; background: var(--accent); color: #000; border: none; padding: 14px; border-radius: 10px; font-weight: 800; font-size: 16px; cursor: pointer; }
    .ticket-box { background: var(--card-bg); border: 2px dashed var(--accent); border-radius: 14px; padding: 20px; text-align: center; margin-top: 15px; }
    .ticket-num { font-size: 36px; font-weight: 800; color: var(--accent); margin: 10px 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2 style="text-align: center; margin-bottom: 15px;">حجز دور في الصالون ✂️</h2>
      
      <div class="form-group">
        <label style="font-size: 13px; color: var(--text-muted);">أدخل كود الصالون</label>
        <input type="text" id="salonCode" class="form-control" placeholder="أدخل كود الصالون">
      </div>

      <div class="form-group">
        <label style="font-size: 13px; color: var(--text-muted);">الاسم الكريم</label>
        <input type="text" id="custName" class="form-control" placeholder="اسمك الكامل">
      </div>

      <div class="form-group">
        <label style="font-size: 13px; color: var(--text-muted);">رقم الهاتف</label>
        <input type="tel" id="custPhone" class="form-control" placeholder="رقم هاتفك">
      </div>

      <button class="btn" id="bookBtn">تأكيد حجز الدور 🎫</button>
    </div>

    <div id="ticketResult" class="card hidden">
      <div class="ticket-box">
        <h3>تم الحجز بنجاح!</h3>
        <p style="color: var(--text-muted); margin-top: 5px;">ترتيبك الحالي في الصالون:</p>
        <div class="ticket-num" id="posNumber">#1</div>
        <p id="salonNameHolder" style="font-weight: 700; color: var(--primary);"></p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const bookBtn = document.getElementById('bookBtn');
      const salonCode = document.getElementById('salonCode');
      const custName = document.getElementById('custName');
      const custPhone = document.getElementById('custPhone');
      const ticketResult = document.getElementById('ticketResult');
      const posNumber = document.getElementById('posNumber');
      const salonNameHolder = document.getElementById('salonNameHolder');

      function getSalons() {
        return JSON.parse(localStorage.getItem('salon_app_db')) || [];
      }

      function getQueue(code) {
        return JSON.parse(localStorage.getItem('queue_' + code)) || [];
      }

      function saveQueue(code, queue) {
        localStorage.setItem('queue_' + code, JSON.stringify(queue));
      }

      bookBtn.addEventListener('click', function() {
        const code = salonCode.value.trim();
        const name = custName.value.trim();
        const phone = custPhone.value.trim();

        if (!code || !name || !phone) {
          alert('يرجى تعبئة كافة البيانات بشكل صحيح!');
          return;
        }

        const salons = getSalons();
        const salon = salons.find(s => s.code === code);

        if (!salon) {
          alert('كود الصالون غير صحيح! تأكد من الكود المكتوب.');
          return;
        }

        let queue = getQueue(code);
        queue.push({ name: name, phone: phone, time: new Date().toLocaleTimeString('ar-EG') });
        saveQueue(code, queue);

        salonNameHolder.innerText = salon.name;
        posNumber.innerText = '#' + queue.length;
        ticketResult.classList.remove('hidden');

        alert(`تم حجز دورك بنجاح في ${salon.name}!\nترتيبك هو: #${queue.length}`);
      });
    });
  </script>
</body>
</html>
